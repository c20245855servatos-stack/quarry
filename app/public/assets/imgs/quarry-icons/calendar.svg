<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar with delivery schedule -->
  <rect x="3" y="4" width="18" height="16" fill="white" stroke="#8B4513" stroke-width="2"/>
  <rect x="3" y="4" width="18" height="4" fill="#8B4513"/>
  
  <!-- Calendar rings -->
  <rect x="6" y="2" width="1" height="4" fill="#654321"/>
  <rect x="17" y="2" width="1" height="4" fill="#654321"/>
  
  <!-- Calendar grid -->
  <line x1="3" y1="10" x2="21" y2="10" stroke="#DDD" stroke-width="1"/>
  <line x1="3" y1="13" x2="21" y2="13" stroke="#DDD" stroke-width="1"/>
  <line x1="3" y1="16" x2="21" y2="16" stroke="#DDD" stroke-width="1"/>
  
  <line x1="8" y1="8" x2="8" y2="20" stroke="#DDD" stroke-width="1"/>
  <line x1="13" y1="8" x2="13" y2="20" stroke="#DDD" stroke-width="1"/>
  <line x1="18" y1="8" x2="18" y2="20" stroke="#DDD" stroke-width="1"/>
  
  <!-- Delivery markers -->
  <circle cx="10" cy="11.5" r="1" fill="#FF6B35"/>
  <circle cx="15" cy="14.5" r="1" fill="#32CD32"/>
  <circle cx="6" cy="17.5" r="1" fill="#FFD700"/>
</svg>